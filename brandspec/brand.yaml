    role: logo
    variant: primary
    description: "Brand mark (bs, outlined stroke) for light backgrounds"
  - file: assets/logo-primary-512.png
    id: logo-primary-512
    role: logo
    variant: primary
    description: "Brand mark 512px PNG — GitHub avatar, social"
  - file: assets/logo-primary-256.png
    id: logo-primary-256
    role: logo
    variant: primary
    description: "Brand mark 256px PNG — README, npm"
  - file: assets/logo-primary-32.png
    id: logo-primary-32
    role: icon
    variant: primary
    description: "Brand mark 32px PNG — small icon contexts"
  - file: assets/logo-horizontal.svg
    id: logo-horizontal
    role: logo
    variant: horizontal
    description: "Logo horizontal layout (bs | brandspec) for headers and README"
  - file: assets/logo-horizontal-h80.png
    id: logo-horizontal-h80
    role: logo
    variant: horizontal
    description: "Logo horizontal 80px height PNG — README fallback"
  - file: assets/favicon.ico
    id: favicon
    role: favicon
    description: "Browser favicon"

guidelines:
  typography-usage:
    content: |
      One font family. Weight and tracking create every expression.
    rules:
      - id: type-single-family
        description: "Only Inter and JetBrains Mono are permitted"
        severity: error
        applies_to: typography
        criteria:
          - "No additional font families"
          - "Inter for all non-code text"
          - "JetBrains Mono for code only"
      - id: type-display-weight
        description: "Display and logo text must use weight 900 with tight tracking"
        severity: error
        applies_to: typography
        criteria:
          - "font-weight: 900"
          - "letter-spacing: -0.045em or tighter"
      - id: type-weight-scale
        description: "Weight assignments by role"
        severity: info
        applies_to: typography
        criteria:
          - "Display / Logo: 900, tracking -0.045em"
          - "Section heading: 600, tracking -0.02em"
          - "Body: 400, tracking 0"
          - "Label: 500, tracking 0.06em (uppercase)"
          - "Code: Mono 400, tracking 0"

  color-usage:
    content: |
      Titanium (warm greys) + Ember (accent). brandspec is a vessel — its visual identity must not compete with the user's brand.
    rules:
      - id: color-no-cold
        description: "No cool-toned colors in the brandspec palette"
        severity: error
        applies_to: color
        criteria:
          - "All colors must have hue between 55-85 (warm range)"
          - "No blue, green, or purple hues"
          - "Status colors (destructive, success, warning, info) also stay within warm hue range 60-80"
      - id: color-ember-sparingly
        description: "Ember accent must be used sparingly"
        severity: warning
        applies_to: color
        criteria:
          - "Ember should not be used as large area background"
          - "Primary use: CTA, links, labels, small highlights"
      - id: color-contrast
        description: "Text must meet WCAG AA contrast"
        severity: error
        applies_to: color
        criteria:
          - "Normal text: contrast ratio >= 4.5:1"
          - "Large text (>=18pt or >=14pt bold): contrast ratio >= 3:1"

  voice-guidelines:
    content: |
      The voice of a forge master — few words, each one precise.
    rules:
      - id: voice-no-marketing
        description: "Copy must avoid marketing superlatives"
        severity: error
        applies_to: voice
        criteria:
          - "No 'revolutionary', 'game-changing', 'cutting-edge', 'amazing', 'powerful'"
          - "No exclamation marks in product copy"
      - id: voice-direct
        description: "Copy must be direct and concise"
        severity: warning
        applies_to: voice
        criteria:
          - "Prefer short sentences"
          - "Active voice over passive"
          - "State facts, not feelings"
      - id: voice-examples
        description: "Voice tone reference"
        severity: info
        applies_to: voice
        criteria:
          - "Do: 'brand.yaml is the single source of truth.'"
          - "Do: 'Define your brand in one file.'"
          - "Don't: 'brand.yaml is your amazing, powerful source of truth!'"
          - "Don't: 'Revolutionize your brand workflow with our cutting-edge platform.'"

extensions:
  brand-philosophy:
    identity: "Consistent Polymorphism — one definition, infinite manifestations"
    layers:
      - layer: "Confront"
        copy: "The hardest thing in the world? Brand."
        component: spec
      - layer: "Forge"
        copy: "Forge it."
        component: workshop
      - layer: "Maintain"
        copy: "Keep the edge."
        component: CLI
      - layer: "Penetrate"
        copy: "Cut through everything."
        component: vision
    sub-identities:
      workshop: "Brand Forger"
  brand-scale:
