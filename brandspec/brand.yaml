guidelines:
  typography-usage:
    content: |
      ## Typography System

      One font. Weight and tracking create every expression.

      | Role            | Weight | Tracking  |
      |-----------------|--------|-----------|
      | Display / Logo  | 900    | -0.045em  |
      | Section heading | 600    | -0.02em   |
      | Body            | 400    | 0         |
      | Label           | 500    | 0.06em (uppercase) |
      | Code            | Mono 400 | 0       |
    rules:
      - id: type-single-family
        description: "Only Inter and JetBrains Mono are permitted"
        severity: error
        applies_to: typography
        criteria:
          - "No additional font families"
          - "Inter for all non-code text"
          - "JetBrains Mono for code only"
      - id: type-display-weight
        description: "Display and logo text must use weight 900 with tight tracking"
        severity: error
        applies_to: typography
        criteria:
          - "font-weight: 900"
          - "letter-spacing: -0.045em or tighter"

  color-usage:
    content: |
      ## Color System

      Titanium (near-neutral warm greys) + Ember (accent).

      ### Titanium
      Primary palette. Hue 60-80, chroma 0.005-0.015.
      Not pure grey — subtly warm.

      ### Ember
      Accent only. Used sparingly for CTAs, links, labels.
      Never as background for large areas.

      ### Design intent
      brandspec is a vessel — its visual identity must not
      compete with the user's brand. Restrained, structural, receding.
    rules:
      - id: color-no-cold
        description: "No cool-toned colors in the brandspec palette"
        severity: error
        applies_to: color
        criteria:
          - "All colors must have hue between 55-85 (warm range)"
          - "No blue, green, or purple hues"
      - id: color-ember-sparingly
        description: "Ember accent must be used sparingly"
        severity: warning
        applies_to: color
        criteria:
          - "Ember should not be used as large area background"
          - "Primary use: CTA, links, labels, small highlights"
      - id: color-contrast
        description: "Text must meet WCAG AA contrast"
        severity: error
        applies_to: color
        criteria:
          - "Normal text: contrast ratio >= 4.5:1"
          - "Large text (>=18pt or >=14pt bold): contrast ratio >= 3:1"

  voice-guidelines:
    content: |
      ## Voice

      Measured. Direct. No fluff.

      The voice of a forge master — few words, each one precise.
      Quality speaks for itself.

      ### Do
      - "brand.yaml is the single source of truth."
      - "Define your brand in one file."
      - "Linting found 2 errors."

      ### Don't
      - "brand.yaml is your amazing, powerful source of truth!"
      - "Revolutionize your brand workflow with our cutting-edge platform."
      - "Oops! We found some issues with your brand."
    rules:
      - id: voice-no-marketing
        description: "Copy must avoid marketing superlatives"
        severity: error
        applies_to: voice
        criteria:
          - "No 'revolutionary', 'game-changing', 'cutting-edge', 'amazing', 'powerful'"
          - "No exclamation marks in product copy"
      - id: voice-direct
        description: "Copy must be direct and concise"
        severity: warning
        applies_to: voice
        criteria:
          - "Prefer short sentences"
          - "Active voice over passive"
          - "State facts, not feelings"

  brand-philosophy:
    content: |
      ## Brand Philosophy

      > The hardest thing in the world? Brand.
      > Forge it. Keep the edge. Cut through everything.

      ### Identity
      Consistent Polymorphism — one definition, infinite manifestations.

      ### Ecosystem layers
      | Layer      | Copy                    | Component  |
      |------------|-------------------------|------------|
      | Confront   | "The hardest thing..."  | spec       |
      | Forge      | "Forge it."             | workshop   |
      | Maintain   | "Keep the edge."        | CLI        |
      | Penetrate  | "Cut through everything"| vision     |

      ### Sub-identities
      - **Workshop**: Brand Forger

extensions:
  copy:
    hero_en: "The hardest thing in the world? Brand. Forge it. Keep the edge. Cut through everything."
    hero_ja: "鍛えろ。研げ。貫け。"
    tagline: "Define once. Brand everywhere."
