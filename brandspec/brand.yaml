# brand.yaml — brandspec itself
# Dogfooding: the spec defines its own brand.

meta:
  name: "brandspec"
  version: "0.1.0"
  updated: "2026-02-19"
  description: "An open specification for defining Brand Identity as code."
  url: "https://github.com/brandspec/brandspec"

core:
  essence: "Consistent Polymorphism — one definition, infinite manifestations"
  tagline: "Define once. Brand everywhere."
  personality:
    - polymorphic
    - consistent
    - open
    - rigorous
    - pragmatic
    - forge & sharpen
  voice:
    tone:
      - measured
      - direct
      - no fluff
    principles:
      - "Technical accuracy is non-negotiable"
      - "Short sentences. Cut unnecessary modifiers"
      - "Treat users as intelligent — don't talk down, don't pander"
      - "Avoid marketing language (revolutionary, game-changing, etc.)"

tokens:
  colors:
    # Brand colors
    primary:
      $value: "oklch(0.65 0.10 70)"
      $type: color
      $description: "Primary accent — CTA, links"
    primary-foreground:
      $value: "oklch(0.97 0.005 80)"
      $type: color
      $description: "Text on primary"
    secondary:
      $value: "oklch(0.55 0.12 65)"
      $type: color
      $description: "Strong accent — hover, emphasis"
    secondary-foreground:
      $value: "oklch(0.97 0.005 80)"
      $type: color
      $description: "Text on secondary"

    # Surface colors
    background:
      $value: "oklch(0.97 0.005 80)"
      $type: color
      $description: "Page background"
    foreground:
      $value: "oklch(0.45 0.015 65)"
      $type: color
      $description: "Body text"
    muted:
      $value: "oklch(0.93 0.008 80)"
      $type: color
      $description: "Card background, subtle fill"
    muted-foreground:
      $value: "oklch(0.65 0.015 70)"
      $type: color
      $description: "Subtext, placeholder"
    border:
      $value: "oklch(0.87 0.010 75)"
      $type: color
      $description: "Border, divider"
    heading:
      $value: "oklch(0.22 0.015 60)"
      $type: color
      $description: "Heading, emphasis"
    accent:
      $value: "oklch(0.80 0.05 75)"
      $type: color
      $description: "Hover, light accent"

    # Status colors (warm hue 60-80 only — color-no-cold compliant)
    destructive:
      $value: "oklch(0.55 0.12 60)"
      $type: color
      $description: "Error, destructive action"
    destructive-foreground:
      $value: "oklch(0.97 0.005 80)"
      $type: color
      $description: "Text on destructive"
    success:
      $value: "oklch(0.60 0.08 80)"
      $type: color
      $description: "Success state"
    success-foreground:
      $value: "oklch(0.22 0.015 60)"
      $type: color
      $description: "Text on success"
    warning:
      $value: "oklch(0.75 0.10 75)"
      $type: color
      $description: "Warning state"
    warning-foreground:
      $value: "oklch(0.22 0.015 60)"
      $type: color
      $description: "Text on warning"
    info:
      $value: "oklch(0.65 0.06 72)"
      $type: color
      $description: "Info state"
    info-foreground:
      $value: "oklch(0.97 0.005 80)"
      $type: color
      $description: "Text on info"

  typography:
    heading:
      $value: "Inter, -apple-system, BlinkMacSystemFont, sans-serif"
      $type: fontFamily
      $description: "Headings"
    body:
      $value: "Inter, -apple-system, BlinkMacSystemFont, sans-serif"
      $type: fontFamily
      $description: "Body text"
    mono:
      $value: "JetBrains Mono, monospace"
      $type: fontFamily
      $description: "Code blocks and technical content"

